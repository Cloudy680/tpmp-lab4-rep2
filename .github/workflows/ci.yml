name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install SQLite (macOS)
        if: runner.os == 'macOS'
        run: brew install sqlite3

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev lcov

      - name: Configure with coverage flags
        run: |
          cmake -S . -B build-coverage \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-coverage -j

      - name: Run tests
        run: ctest --test-dir build-coverage --output-on-failure

      - name: Capture coverage (lcov)
        run: |
          lcov --directory build-coverage --capture --output-file coverage.info \
               --ignore-errors mismatch \
               --rc lcov_branch_coverage=0
          lcov --remove coverage.info '/usr/*' '*/tests/*' --output-file coverage.filtered

      - name: Upload HTML report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.filtered

      - name: Upload to Codecov (optional)
        uses: codecov/codecov-action@v4
        with:
          file: coverage.filtered
          fail_ci_if_error: false